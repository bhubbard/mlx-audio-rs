[package]
name = "mlx-audio-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "Native Apple Silicon Rust audio engine for TTS, STT, neural codecs, and VAD using MLX"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/mlx-audio-rs"
homepage = "http://code.brandonhubbard.com/mlx-audio-rs/"

[[bin]]
name = "mlx-audio"
path = "src/bin/main.rs"

[lib]
name = "mlx_audio_rs"
path = "src/lib.rs"

[dependencies]
mlx-rs = "0.32.0"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
safetensors = "0.8"
hound = "3.5"
tokio = { version = "1.40", features = ["full"] }

[dev-dependencies]
tempfile = "3.12"
